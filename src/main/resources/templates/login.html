<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body><header th:replace="~{general/fragmentos :: header}"></header><main class="container py-5"><div class="row justify-content-center"><div class="col-sm-9 col-md-7 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 section-title text-center mb-2"><i class="fa-solid fa-lock me-2"></i>Iniciar sesión</h1><p class="small-muted text-center">Acceso por roles · Semana 9</p>
<div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</div><div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente.</div>
<form method="post" th:action="@{/login}"><div class="mb-3"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" type="text" name="username" autocomplete="username" required autofocus></div><div class="mb-3"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required></div><button type="submit" class="btn btn-success w-100">Ingresar</button></form>
<div class="notice mt-4 small"><strong>Usuarios de práctica:</strong> juan (ADMIN), rebeca (VENDEDOR) y pedro (USUARIO).<br>La contraseña de prueba está indicada en el archivo <code>LEEME.md</code> incluido en el ZIP.</div></div></div></div></div></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
