<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"><head th:replace="~{general/fragmentos :: head}"></head><body>
<header th:replace="~{general/fragmentos :: header}"></header><div th:replace="~{general/fragmentos :: flash}"></div><main class="container py-4">
 <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4"><div><h1 class="h2 section-title mb-1">Listado de categorías</h1><span class="small-muted">Total: <strong th:text="${totalCategorias}"></strong></span></div><a sec:authorize="hasRole('ADMIN')" class="btn btn-success" th:href="@{/categoria/nuevo}"><i class="fa-solid fa-plus me-1"></i>Agregar categoría</a></div>
 <div class="card shadow-sm"><div class="card-body table-responsive"><table class="table table-striped table-hover align-middle"><thead><tr><th>ID</th><th>Descripción</th><th>Estado</th><th>Imagen</th><th sec:authorize="hasRole('ADMIN')">Acciones</th></tr></thead><tbody>
 <tr th:each="c : ${categorias}"><td th:text="${c.idCategoria}"></td><td th:text="${c.descripcion}"></td><td><span class="badge" th:classappend="${c.activo} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${c.activo} ? 'Activa':'Inactiva'"></span></td><td><img th:if="${c.rutaImagen != null}" th:src="@{${c.rutaImagen}}" height="46" alt="Imagen de categoría"><span th:unless="${c.rutaImagen != null}" class="text-muted small">Sin imagen</span></td>
 <td sec:authorize="hasRole('ADMIN')"><div class="d-flex gap-2"><a class="btn btn-warning btn-sm" th:href="@{/categoria/modificar/{id}(id=${c.idCategoria})}"><i class="fa-solid fa-pen me-1"></i>Editar</a><form th:action="@{/categoria/eliminar}" method="post" onsubmit="return confirm('¿Eliminar esta categoría?');"><input type="hidden" name="idCategoria" th:value="${c.idCategoria}"><button class="btn btn-outline-danger btn-sm" type="submit"><i class="fa-solid fa-trash me-1"></i>Eliminar</button></form></div></td></tr>
 </tbody></table><p class="text-center text-muted my-3" th:if="${#lists.isEmpty(categorias)}">No hay categorías registradas.</p></div></div>
</main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
