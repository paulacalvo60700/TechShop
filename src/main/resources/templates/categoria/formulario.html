<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body>
<header th:replace="~{general/fragmentos :: header}"></header><main class="container py-4"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-header py-3"><h1 class="h4 m-0" th:text="${categoria.idCategoria == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h1></div>
<form method="post" th:action="@{/categoria/guardar}" th:object="${categoria}" enctype="multipart/form-data"><div class="card-body"><input type="hidden" th:field="*{idCategoria}">
<div class="mb-3"><label class="form-label" for="descripcion">Descripción</label><input id="descripcion" class="form-control" type="text" maxlength="50" required th:field="*{descripcion}"><div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div></div>
<div class="form-check mb-3"><input class="form-check-input" id="activo" type="checkbox" th:field="*{activo}"><label for="activo" class="form-check-label">Categoría activa</label></div>
<div class="mb-3"><label for="imagenFile" class="form-label">Imagen opcional</label><input class="form-control" id="imagenFile" name="imagenFile" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,image/*"><div class="form-text">Se guarda localmente, sin Firebase. Tamaño máximo: 2 MB.</div><img class="mt-2" th:if="${categoria.rutaImagen != null}" th:src="@{${categoria.rutaImagen}}" alt="Imagen actual" height="90"></div>
</div><div class="card-footer d-flex justify-content-between py-3"><a class="btn btn-outline-secondary" th:href="@{/categoria/listado}">Cancelar</a><button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar</button></div></form>
</div></div></div></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
