<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TechShop</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}">
    <link rel="stylesheet" th:href="@{/css/techshop.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">TechShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <!-- Semana 9: estos enlaces solamente son visibles para ADMIN o VENDEDOR. -->
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                        <a class="nav-link" th:href="@{/categoria/listado}">Categorías</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                        <a class="nav-link" th:href="@{/producto/listado}">Productos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','VENDEDOR')">
                        <a class="nav-link" th:href="@{/consultas/listado}">Consultas</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <span class="nav-link">Administración</span>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','USUARIO')">
                        <a class="nav-link" th:href="@{/carrito}">Carrito</a>
                    </li>
                </ul>
                <!-- Semana 9: login visible solo cuando NO hay sesión. -->
                <a class="nav-link me-3" sec:authorize="isAnonymous()" th:href="@{/login}">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar
                </a>
                <!-- Semana 9: logout visible cuando hay sesión, vía POST y token CSRF. -->
                <span class="small text-muted me-2" sec:authorize="isAuthenticated()"
                      sec:authentication="name">usuario</span>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="mb-0">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">
                        <i class="fa-solid fa-right-from-bracket"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        <div class="tienda-encabezado text-center">
            <h1 class="h3 mb-0"><i class="fa-solid fa-gear me-2"></i>Su tienda en línea</h1>
        </div>
    </div>
</header>
<div th:fragment="flash" class="container mt-3">
    <div class="alert alert-success" th:if="${todoOk}" th:text="${todoOk}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>
<footer th:fragment="footer" class="container py-4 mt-4 border-top text-center small text-muted">
    TechShop · SC-403 · Desarrollo de Aplicaciones Web y Patrones
</footer>
</body>
</html>
