<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body><header th:replace="~{general/fragmentos :: header}"></header><main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-header py-3"><h1 class="h4 mb-0" th:text="${producto.idProducto == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1></div>
<form th:action="@{/producto/guardar}" method="post" th:object="${producto}" enctype="multipart/form-data"><div class="card-body"><input type="hidden" th:field="*{idProducto}">
<div class="row g-3"><div class="col-md-6"><label for="categoria" class="form-label">Categoría</label><select id="categoria" class="form-select" th:field="*{categoria.idCategoria}" required><option value="">Seleccionar…</option><option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.descripcion}"></option></select><div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div></div>
<div class="col-md-6"><label for="descripcion" class="form-label">Nombre del producto</label><input type="text" id="descripcion" class="form-control" th:field="*{descripcion}" maxlength="50" required><div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div></div>
<div class="col-12"><label for="detalle" class="form-label">Detalle</label><textarea id="detalle" class="form-control" th:field="*{detalle}" rows="3"></textarea></div>
<div class="col-md-6"><label for="precio" class="form-label">Precio (₡)</label><input id="precio" type="number" min="0.01" step="0.01" class="form-control" th:field="*{precio}" required><div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div></div>
<div class="col-md-6"><label for="existencias" class="form-label">Existencias</label><input type="number" id="existencias" min="0" step="1" class="form-control" th:field="*{existencias}" required><div class="text-danger small" th:if="${#fields.hasErrors('existencias')}" th:errors="*{existencias}"></div></div>
<div class="col-12"><div class="form-check"><input id="activo" type="checkbox" class="form-check-input" th:field="*{activo}"><label for="activo" class="form-check-label">Producto activo</label></div></div>
<div class="col-12"><label for="imagenFile" class="form-label">Foto opcional</label><input id="imagenFile" type="file" name="imagenFile" class="form-control" accept=".jpg,.jpeg,.png,.gif,.webp,image/*"><div class="form-text">Se guarda en la carpeta uploads del proyecto. Máximo 2 MB.</div><img th:if="${producto.rutaImagen != null}" th:src="@{${producto.rutaImagen}}" height="100" class="mt-2" alt="Imagen actual"></div>
</div></div><div class="card-footer py-3 d-flex justify-content-between"><a th:href="@{/producto/listado}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-success" type="submit"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar producto</button></div></form>
</div></div></div></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
