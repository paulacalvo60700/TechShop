<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body><header th:replace="~{general/fragmentos :: header}"></header><div th:replace="~{general/fragmentos :: flash}"></div><main class="container py-4"><h1 class="h2 section-title">Carrito de compras</h1><p class="small-muted">Práctica local: el botón de confirmar simula el pedido, no realiza cobros ni modifica existencias.</p>
<div class="card shadow-sm mb-3"><div class="card-body table-responsive"><table class="table align-middle"><thead><tr><th>Producto</th><th>Unidades</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody><tr th:each="l : ${lineas}"><td th:text="${l.p.descripcion}"></td><td th:text="${l.cantidad}"></td><td th:text="'₡'+${#numbers.formatDecimal(l.p.precio,1,'POINT',2,'COMMA')}"></td><td th:text="'₡'+${#numbers.formatDecimal(l.subtotal,1,'POINT',2,'COMMA')}"></td><td><form th:action="@{/carrito/eliminar}" method="post"><input name="idProducto" type="hidden" th:value="${l.p.idProducto}"><button class="btn btn-outline-danger btn-sm" type="submit">Quitar</button></form></td></tr></tbody></table><p class="text-muted text-center" th:if="${#lists.isEmpty(lineas)}">Tu carrito está vacío.</p></div></div>
<div class="d-flex align-items-center justify-content-between flex-wrap gap-3"><a class="btn btn-outline-success" th:href="@{/}">Seguir explorando</a><div><strong class="h4 me-3" th:text="'Total: ₡'+${#numbers.formatDecimal(total,1,'POINT',2,'COMMA')}">Total</strong><form th:if="${!#lists.isEmpty(lineas)}" th:action="@{/carrito/confirmar}" method="post" class="d-inline"><button class="btn btn-success" type="submit">Simular pedido</button></form></div></div></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
