# TechShop SC-403 - MySQL (Semana 3) + Spring Security (Semana 9)
spring.application.name=TechShop
server.port=${PORT:8086}
spring.thymeleaf.cache=false
spring.main.banner-mode=off

# Datos configurados para usar la base MySQL del script de la profesora.
# El password debe ingresarse mediante la variable TECHSHOP_DB_PASSWORD
# o el archivo local config/techshop-local.properties (excluido de Git).
spring.config.import=optional:file:./config/techshop-local.properties
spring.datasource.url=${TECHSHOP_DB_URL:jdbc:mysql://localhost:3306/techshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TECHSHOP_DB_USER:usuario_prueba}
spring.datasource.password=${TECHSHOP_DB_PASSWORD:}

# Las tablas las crea el script SQL, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sin Firebase. Las imágenes subidas por formulario quedan en uploads/.
techshop.upload-dir=./uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Usuarios en memoria para la práctica de seguridad de Semana 9.
techshop.demo-password=${TECHSHOP_DEMO_PASSWORD:Demo2026!}
