# Desarrollo: servidor local en Mac (no requiere permisos de administrador)
spring.application.name=TechShop
server.port=${PORT:8086}
spring.thymeleaf.cache=false
spring.main.banner-mode=off

# H2 persiste la información en la carpeta data/ del proyecto.
# No se utiliza Firebase, ni es necesario instalar MySQL.
spring.datasource.url=jdbc:h2:file:./data/techshop;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos guardadas en el disco local (carpeta uploads/)
techshop.upload-dir=./uploads
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Solo para desarrollo: elegir con variable de entorno al ejecutar, si se desea.
techshop.demo-password=${TECHSHOP_DEMO_PASSWORD:Demo2026!}
