# Alternativa para usar MySQL EXISTENTE, sin Firebase.
# Ejecución opcional: SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=${TECHSHOP_DB_URL:jdbc:mysql://localhost:3306/techshop}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TECHSHOP_DB_USER:usuario_prueba}
spring.datasource.password=${TECHSHOP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
